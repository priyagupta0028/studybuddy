<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Study Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#4F46E5;--sec:#A78BFA;--bg:#F8FAFC;--card:#fff;--tx:#172554;--mut:#64748b;--acc:#38BDF8;--bd:#e2e8f0;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141b34;--tx:#e5e9ff;--mut:#94a3b8;--bd:#263056}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141b34;--tx:#e5e9ff;--mut:#94a3b8;--bd:#263056}
*{box-sizing:border-box}html,body{height:auto;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif;line-height:1.55;overflow-x:hidden}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}a{color:var(--pri);text-decoration:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:19px;color:var(--tx);display:flex;gap:8px;align-items:center}.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--sec));display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.sp{flex:1}.tl{display:flex;gap:18px;font-size:14px;font-weight:500}.tl a{color:var(--mut)}
.btn{border:0;border-radius:12px;padding:10px 18px;font:600 14px inherit;font-family:inherit;cursor:pointer;background:var(--pri);color:#fff;transition:.15s;min-height:42px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,70,229,.3)}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.g:hover{box-shadow:none;border-color:var(--pri)}.btn.s{padding:7px 12px;min-height:34px;font-size:13px}.btn:disabled{opacity:.55;cursor:wait;transform:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 2px 12px rgba(23,37,84,.05);animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.shell{display:flex;min-height:calc(100vh - 62px)}.side{width:220px;padding:18px 12px;border-right:1px solid var(--bd);position:sticky;top:62px;align-self:flex-start}
.side a{display:flex;gap:10px;padding:10px 12px;border-radius:12px;color:var(--mut);font-weight:600;font-size:14px;margin-bottom:4px}.side a.on,.side a:hover{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
main{flex:1;min-width:0;padding:28px;max-width:1040px;margin:0 auto;width:100%}
.bn{display:none}
@media(max-width:860px){.side{display:none}.tl{display:none}main{padding:18px 16px 90px}.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}.bn a{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--mut);padding:4px}.bn a.on{color:var(--pri)}.bn a b{display:block;font-size:19px;font-weight:400}}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{font-size:13px;font-weight:600;display:block;margin:0 0 6px}input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:500 14px inherit;font-family:inherit;min-height:44px}input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
.hero{text-align:center;padding:64px 20px 40px;max-width:820px;margin:0 auto}.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.03em}.hero h1 span,.grad{background:linear-gradient(90deg,var(--pri),var(--sec));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:18px;max-width:640px;margin:0 auto 26px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.c{justify-content:center}
.sec{max-width:1040px;margin:0 auto;padding:44px 20px}.sec h2{font-size:30px;text-align:center;letter-spacing:-.02em}.sub{text-align:center;color:var(--mut);margin:-4px 0 28px}
.ic{width:44px;height:44px;border-radius:13px;background:color-mix(in srgb,var(--pri) 12%,transparent);display:grid;place-items:center;font-size:22px;margin-bottom:12px}
.stat b{font-size:28px;display:block}.stat span,.mut{color:var(--mut);font-size:13px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--pri)}.warn{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#b45309}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;border:1.5px solid var(--bd);border-radius:13px;background:var(--card);color:var(--tx);font:500 15px inherit;font-family:inherit;margin-bottom:10px;cursor:pointer;min-height:48px}.opt:hover{border-color:var(--pri)}.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--sec));transition:width .3s}
.md h2,.md h3{font-size:17px;color:var(--pri)}.md ul{padding-left:20px;margin:6px 0}.md p{margin:6px 0}.md table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}.md td,.md th{border:1px solid var(--bd);padding:6px 10px;text-align:left}
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--bd),var(--bg),var(--bd));background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}@keyframes sh{to{background-position:-200% 0}}
.cols{display:flex;align-items:flex-end;gap:8px;height:120px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.cols i{display:block;background:linear-gradient(var(--sec),var(--pri));border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw}#toast.on{opacity:1}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);max-width:min(680px,92vw);max-height:84vh;padding:22px}dialog::backdrop{background:rgba(10,15,40,.5)}
.pv{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:0 24px 60px rgba(79,70,229,.18);max-width:760px;margin:36px auto 0;text-align:left}
footer{border-top:1px solid var(--bd);padding:30px 20px;text-align:center;color:var(--mut);font-size:13px}
</style></head><body>
<div class="top"><a class="logo" href="#home"><i>✦</i>Study Buddy</a><div class="tl"><a href="#about">About</a><a href="#contact">Contact</a></div><div class="sp"></div><button class="btn g s" data-a="theme" aria-label="Toggle dark mode">◐</button><a class="btn s" href="#dashboard">Open app</a></div>
<div id="app"></div><div id="toast"></div><dialog id="dlg"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
const $=q=>document.querySelector(q),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="studybuddy.v1";let S={name:"Student",demo:false,ex:[],qz:[],mat:[],act:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const log=t=>{S.act.push({t,ts:Date.now()});save()};
function toast(m){const t=$("#toast");t.textContent=m;t.className="on";clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",2400)}
function theme(){const r=document.documentElement,d=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark";r.dataset.theme=d?"light":"dark";try{localStorage.setItem("sb.theme",r.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem("sb.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
/* ---------- AI service layer ---------- */
const AI={
 async run(p,json){const s=window.claude&&await claude.use("sample");if(!s)throw{code:"unavail"};return json?s.json(p,{cache:false}):(await s(p,{cache:false})).text},
 err(e){const m={unavail:"Live AI isn’t available in this view.",not_granted:"AI permission was declined. Allow it and try again.",rate_limited:"Too many requests. Wait a moment and retry.",invalid_json:"The AI reply was malformed. Please retry."};return m[e&&e.code]||"Network or AI error. Please try again."},
 explain:(f,mod)=>AI.run(`You are an expert university tutor. Explain "${f.topic}" (subject: ${f.subject||"general"}; level: ${f.level}; language: ${f.lang==="Hinglish"?"Hinglish (Hindi in Latin script mixed with English)":"simple English"}). ${mod?"Extra instruction: "+mod+". ":""}Reply in markdown using exactly these ## sections in order: Simple Definition, Introduction, Detailed Explanation, Important Concepts, Step-by-Step Explanation, Real-Life Examples, Important Formulas, Applications, Key Points to Remember, Quick Revision Summary. Use **bold** for key terms, bullet lists, and a markdown table where it helps. Be academically accurate.`),
 chat:(m)=>AI.run(m.map((x,i)=>i?x:{role:x.role,content:CHATSYS+"\n\nStudent: "+x.content})),
 quiz:(f)=>AI.run(`${f.text?"Study material from the student's PDF ("+f.pdfName+"):\n<<<\n"+f.text+"\n>>>\nWrite every question ONLY from this material"+(f.focus?", focusing on: "+f.focus:"")+". Do not ask about anything the material does not cover.\n\n":""}Create ${f.n} academically accurate multiple-choice questions on "${f.focus||f.topic}" (subject: ${f.subject||"general"}), difficulty ${f.diff}, for university students. Return ONLY JSON: {"questions":[{"q":string,"options":[4 strings],"answer":index 0-3,"explanation":string}]}. Exactly one option is correct; vary the correct position.`,true),
 material:(f,type)=>AI.run(`Create "${type}" study material for "${f.topic}" (subject: ${f.subject||"general"}; level: ${f.level}; language: ${f.lang==="Hinglish"?"Hinglish (Hindi in Latin script mixed with English)":"English"}). Use markdown with ## headings, ### subheadings, definitions, bullets, tables, examples, key formulas, exam-oriented points and key takeaways where relevant. For flashcards use a table with Question and Answer columns.`),
 ask:(ctx,q)=>AI.run(`Context (an explanation of a topic):\n${ctx.slice(0,6000)}\n\nStudent follow-up question: ${q}\nAnswer clearly in markdown for a university student.`)
};
const DEMO={explain:"## Simple Definition\nDemo content: a matrix **A** is diagonalizable if A = PDP⁻¹ for a diagonal matrix D.\n## Key Points to Remember\n- Needs n linearly independent eigenvectors\n- D holds the eigenvalues",quiz:[{q:"A matrix is diagonalizable if it has…",options:["n independent eigenvectors","Zero determinant","All entries equal","Only real entries"],answer:0,explanation:"Diagonalization needs n linearly independent eigenvectors."},{q:"The diagonal entries of D are the…",options:["Eigenvalues","Eigenvectors","Minors","Cofactors"],answer:0,explanation:"D contains the eigenvalues of A."},{q:"If A = PDP⁻¹, then Aⁿ equals…",options:["PDⁿP⁻¹","PⁿDP⁻¹","DⁿP","nPDP⁻¹"],answer:0,explanation:"Powers act only on the diagonal D."}]};
/* ---------- mini markdown ---------- */
function md(t){const L=esc(t).split("\n");let o="",ul=0,tb=0;const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");const cu=()=>{if(ul){o+="</ul>";ul=0}if(tb){o+="</table>";tb=0}};
for(const l of L){let m;if(/^\s*\|.*\|\s*$/.test(l)){if(/^[\s|:-]+$/.test(l))continue;if(ul){o+="</ul>";ul=0}const c=l.trim().slice(1,-1).split("|").map(x=>inl(x.trim()));o+=(tb?"":"<table>")+"<tr>"+c.map(x=>tb?`<td>${x}</td>`:`<th>${x}</th>`).join("")+"</tr>";tb=1;continue}
if(tb){o+="</table>";tb=0}
if(m=l.match(/^\s*[-*]\s+(.*)/)){if(!ul){o+="<ul>";ul=1}o+=`<li>${inl(m[1])}</li>`;continue}cu();
if(m=l.match(/^#{1,2}\s+(.*)/))o+=`<h2>${inl(m[1])}</h2>`;else if(m=l.match(/^#{3,}\s+(.*)/))o+=`<h3>${inl(m[1])}</h3>`;else if(l.trim())o+=`<p>${inl(l)}</p>`}
cu();return o}
const cards=t=>t.split(/^(?=##\s)/m).filter(x=>x.trim()).map(x=>`<div class="card md" style="margin-bottom:14px">${md(x)}</div>`).join("");
/* ---------- helpers ---------- */
const subjects=["Mathematics","Computer Science","Physics","Chemistry","Electronics","Mechanical Engineering","Economics","Management","Biology","Other"];
const opts=a=>a.map(x=>`<option>${x}</option>`).join("");
const fld=(id,l,inner)=>`<div><label for="${id}">${l}</label>${inner}</div>`;
const form=(p,extra="")=>`<div class="grid g2">${fld(p+"t","Topic name",`<input id="${p}t" placeholder="e.g. Diagonalization of Matrices">`)}${fld(p+"s","Subject",`<select id="${p}s">${opts(subjects)}</select>`)}${extra}</div>`;
const val=p=>({topic:$("#"+p+"t").value.trim(),subject:$("#"+p+"s").value,level:$("#"+p+"l")?.value,lang:$("#"+p+"g")?.value,diff:$("#"+p+"d")?.value,n:+($("#"+p+"n")?.value||5)});
const lvl=p=>fld(p+"l","Education level",`<select id="${p}l">${opts(["Beginner","Intermediate","Advanced"])}</select>`);
const dl=(url,name,body)=>`<a href="${url}">${body}</a>`;
const skel=()=>`<div class="card"><div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk"></div><div class="sk" style="width:70%"></div></div>`;
const fmt=ts=>new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const tips=["Study in 25-minute focused blocks, then rest for 5.","Test yourself before rereading: active recall beats highlighting.","Explain a concept aloud as if teaching a friend.","Space your revision: 1 day, 3 days, then a week.","Solve past papers under timed conditions."];
/* ---------- views ---------- */
const V={};
V.home=()=>`<section class="hero"><span class="tag">AI study companion for universities</span><h1 style="margin-top:16px">Make Every Study Session <span>Smarter.</span></h1><p>Your personal AI study companion to understand difficult concepts, test your knowledge, and create effective study materials — all in one place.</p><div class="row c"><a class="btn" href="#dashboard">Start Learning</a><a class="btn g" href="#features">Explore Features</a></div>
<div class="pv"><div class="grid g3">${[["💡","Explain Topic","Ten-part structured explanations"],["📝","Quiz Generator","Scored, explained MCQs"],["📚","Study Materials","Notes, flashcards, cheat sheets"]].map(x=>`<div class="card" style="box-shadow:none"><div class="ic">${x[0]}</div><b>${x[1]}</b><div class="mut">${x[2]}</div><div class="bar" style="margin-top:12px"><i style="width:${40+Math.random()*50|0}%"></i></div></div>`).join("")}</div></div></section>
<section class="sec" id="features"><h2>Everything you need to study well</h2><p class="sub">Three focused tools, one calm workspace.</p><div class="grid g3">${[["💡","Explain a Topic","Pick a topic, level and language (English or Hinglish) and get a clear, structured breakdown with formulas, examples and revision points.","explain"],["📝","Create a Quiz","Generate 5 to 20 questions, answer one at a time, and get honest scoring with explanations and revision advice.","quiz"],["📚","Generate Study Material","Short notes, detailed notes, exam questions, flashcards, mind maps and cheat sheets. Edit, save and download.","materials"]].map(x=>`<a class="card" href="#${x[3]}" style="color:inherit"><div class="ic">${x[0]}</div><h3>${x[1]}</h3><div class="mut">${x[2]}</div></a>`).join("")}</div></section>
<section class="sec"><h2>How it works</h2><p class="sub">From confusion to confidence in three steps.</p><div class="grid g3">${[["1","Choose a topic","Type what you’re studying and set your level."],["2","Learn and practise","Read the explanation, then test yourself with a quiz."],["3","Revise and keep","Save materials to your library and track progress."]].map(x=>`<div class="card"><div class="ic grad" style="font-weight:800">${x[0]}</div><h3>${x[1]}</h3><div class="mut">${x[2]}</div></div>`).join("")}</div></section>
<section class="sec"><h2>Why Study Buddy</h2><p class="sub">Built for BTech and university coursework.</p><div class="grid g4">${[["Exam-oriented","Content shaped for internals and semester exams."],["Hinglish mode","Concepts explained the way you think."],["Honest scoring","Quiz scores are computed in the app, not trusted from AI."],["Private by default","Your history stays in your own browser."]].map(x=>`<div class="card"><b>${x[0]}</b><div class="mut">${x[1]}</div></div>`).join("")}</div></section>
<section class="sec"><div class="card" style="text-align:center;padding:44px 20px;background:linear-gradient(135deg,var(--pri),var(--sec));color:#fff;border:0"><h2 style="color:#fff">Your Learning. Your Pace. Your Success.</h2><a class="btn" style="background:#fff;color:var(--pri)" href="#dashboard">Start Learning</a></div></section>`;
V.about=()=>`<section class="sec" style="max-width:720px"><h2>About Study Buddy</h2><div class="card"><p>Study Buddy helps university students understand difficult topics, practise with quizzes and build revision material, at their own pace.</p><p class="mut">We believe good explanations, honest feedback and well-organised notes make exam preparation calmer and more effective.</p></div></section>`;
V.contact=()=>`<section class="sec" style="max-width:640px"><h2>Contact Us</h2><div class="card grid"><div>${fld("cn","Name",`<input id="cn">`)}</div>${fld("cm","Message",`<textarea id="cm" rows="4"></textarea>`)}<button class="btn" data-a="contact">Send message</button><div class="mut">Messages are not sent to a server in this version. Your draft is only checked in your browser.</div></div></section>`;
function stats(){if(S.demo)return{ex:24,qz:11,mat:8,avg:78,wk:[2,4,3,6,1,5,4],sc:[60,70,65,80,85,90]};const wk=[0,0,0,0,0,0,0],now=new Date().setHours(0,0,0,0);S.act.forEach(a=>{const d=Math.floor((now-new Date(a.ts).setHours(0,0,0,0))/864e5);if(d>=0&&d<7)wk[6-d]++});return{ex:S.ex.length,qz:S.qz.length,mat:S.mat.length,avg:S.qz.length?Math.round(S.qz.reduce((a,q)=>a+q.pct,0)/S.qz.length):0,wk,sc:S.qz.slice(-6).map(q=>q.pct)}}
const chart=(a,l)=>`<div class="cols">${a.length?a.map((v,i)=>`<div title="${v}"><i style="height:${Math.max(3,v/Math.max(...a,1)*100)}%"></i>${l?l[i]:v}</div>`).join(""):'<span class="mut">No data yet</span>'}</div>`;
V.dashboard=()=>{const s=stats(),days=[...Array(7)].map((_,i)=>["S","M","T","W","T","F","S"][new Date(Date.now()-(6-i)*864e5).getDay()]);const rec=S.demo?[]:[...S.ex.map(x=>({k:"💡 Explained",t:x.topic,ts:x.ts})),...S.qz.map(x=>({k:"📝 Quiz",t:`${x.topic} · ${x.pct}%`,ts:x.ts})),...S.mat.map(x=>({k:"📚 Material",t:x.topic+" · "+x.type,ts:x.ts}))].sort((a,b)=>b.ts-a.ts).slice(0,6);
return `<div class="row"><div><h1>Welcome back, ${esc(S.name)}!</h1><div class="mut">Ready to achieve your learning goals today?</div></div><div class="sp"></div>${S.demo?'<span class="tag warn">Demo data</span>':""}<button class="btn g s" data-a="demo">${S.demo?"Hide":"Show"} demo data</button></div><br>
<div class="grid g4">${[["Topics Explained",s.ex],["Quizzes Completed",s.qz],["Materials Generated",s.mat],["Average Quiz Score",s.avg+"%"]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div><br>
<div class="grid g3">${[["💡","Explain a Topic","explain"],["📝","Create a Quiz","quiz"],["📚","Generate Study Material","materials"]].map(x=>`<a class="card" href="#${x[2]}" style="color:inherit"><div class="ic">${x[0]}</div><h3 style="margin:0">${x[1]}</h3></a>`).join("")}</div><br>
<div class="grid g2"><div class="card"><h3>Weekly activity</h3>${chart(s.wk,days)}</div><div class="card"><h3>Quiz performance (%)</h3>${chart(s.sc)}</div></div><br>
<div class="grid g2"><div class="card"><h3>Recent activity</h3>${rec.length?rec.map(r=>`<div style="padding:7px 0;border-bottom:1px solid var(--bd)"><span class="mut">${r.k} · ${fmt(r.ts)}</span><br>${esc(r.t)}</div>`).join(""):'<div class="mut">Nothing yet. Explain a topic or take a quiz to get started.</div>'}<p><a href="#history">View all history →</a></p></div>
<div class="card"><h3>Continue learning</h3>${S.ex.slice(-3).reverse().map(x=>`<button class="btn g s" style="margin:0 6px 8px 0" data-a="again" data-t="${esc(x.topic)}" data-s="${esc(x.subject)}">${esc(x.topic)}</button>`).join("")||'<div class="mut">Topics you explain will appear here.</div>'}<h3 style="margin-top:18px">Study tip</h3><div class="mut" id="tip">${tips[(Date.now()/36e5|0)%tips.length]}</div></div></div>`};
/* Explain */
let E={md:"",f:null};
V.explain=()=>`<h1>Explain a Topic</h1>${`<div class="card">${form("e",lvl("e")+fld("eg","Language",`<select id="eg">${opts(["Simple English","Hinglish"])}</select>`))}<br><button class="btn" id="eb" data-a="explain">Generate Explanation</button></div>`}<div id="eo" style="margin-top:18px">${E.md?eout():""}</div>`;
const eout=()=>`<div class="row" style="margin-bottom:14px">${[["Explain More Simply","Explain in much simpler words with everyday analogies"],["Explain in More Detail","Go deeper with more rigorous detail"],["Give More Examples","Add several more worked examples"],["Explain Step by Step","Emphasise a careful step-by-step derivation"]].map(x=>`<button class="btn g s" data-a="explain" data-m="${x[1]}">${x[0]}</button>`).join("")}<button class="btn g s" data-a="copy" data-w="e">Copy Explanation</button></div>${cards(E.md)}<div class="card"><label for="fq">Ask a follow-up question</label><div class="row"><input id="fq" style="flex:1;min-width:200px" placeholder="e.g. Why must eigenvectors be independent?"><button class="btn" data-a="follow">Ask</button></div><div id="fo"></div></div>`;
async function explain(mod){const f=mod?E.f:val("e");if(!f||!f.topic)return toast("Please enter a topic first");E.f=f;const b=$("#eb");b.disabled=true;$("#eo").innerHTML=skel()+skel();
try{E.md=await AI.explain(f,mod);if(!E.md.trim())throw{};if(!mod){S.ex.push({topic:f.topic,subject:f.subject,ts:Date.now()});log("ex")}}catch(e){if(e&&e.code==="unavail"){E.md=DEMO.explain;$("#eo").innerHTML='<span class="tag warn">Demo content, not a live AI response</span><br><br>'+eout();b.disabled=false;return}$("#eo").innerHTML=`<div class="card">⚠️ ${AI.err(e)}</div>`;b.disabled=false;return}
$("#eo").innerHTML=eout();b.disabled=false}
/* Quiz */
let Q=null;
const QS={mode:"topic",pdf:null,chat:[],ready:"",busy:false};
const CHATSYS="You are Study Buddy's quiz coach for university students. Help the student decide ONE topic to practise in a quiz. Ask at most one short clarifying question at a time (subject, chapter, what they find hard, exam focus) and offer 2-4 concrete topic suggestions when helpful. Keep replies under 90 words. When the student has clearly settled on a topic, finish your reply with a final line in exactly this form: READY_TOPIC: <topic> | <subject>. Never include that line before they settle.";
const qtabs=[["topic","✏️ Type a topic"],["pdf","📄 Upload PDF"],["chat","💬 Chat to choose"]];
const bub=(r,t)=>`<div style="display:flex;justify-content:${r==="user"?"flex-end":"flex-start"};margin:6px 0"><div style="max-width:85%;padding:9px 13px;border-radius:14px;font-size:14px;white-space:pre-wrap;${r==="user"?"background:var(--pri);color:#fff":"background:var(--bg);border:1px solid var(--bd)"}">${esc(t)}</div></div>`;
function qsrc(){if(QS.mode==="pdf")return QS.pdf?`<div class="card" style="background:var(--bg);margin-bottom:14px"><div class="row"><div><b>📄 ${esc(QS.pdf.name)}</b><div class="mut">${QS.pdf.pages} pages · ${QS.pdf.text.length.toLocaleString()} characters read</div></div><div class="sp"></div><button class="btn g s" data-a="pdfclear">Remove</button></div>${QS.pdf.text.length>28000?`<p class="mut" style="margin:8px 0 0">Long file: the quiz uses about 28,000 characters at a time. Type a chapter or topic name below to target that part.</p>`:""}</div><p class="mut" style="margin:0 0 12px">Leave Topic name blank to cover the whole PDF, or type a chapter or topic to focus on it.</p>`:`<label for="qf">Upload your study material (PDF)</label><input type="file" id="qf" accept="application/pdf,.pdf"><div id="qst" class="mut" style="margin:8px 0 14px">Text PDFs only, up to 25 MB. Scanned images can’t be read. Questions are written only from your file.</div>`;
if(QS.mode==="chat")return `<div id="qc" style="max-height:300px;overflow:auto;padding:4px 2px;margin-bottom:10px">${bub("assistant","Hi! Tell me what you’re studying or what you want to practise, and I’ll help you pick a topic.")}${QS.chat.map(m=>bub(m.role,m.content.replace(/READY_TOPIC:.*$/m,"").trim())).join("")}${QS.busy?bub("assistant","Thinking…"):""}</div>${QS.ready?`<p><span class="tag">Topic set: ${esc(QS.ready)}</span> <span class="mut">Adjust the options below and press Generate Quiz.</span></p>`:""}<div class="row" style="margin-bottom:14px"><input id="qci" placeholder="e.g. I have a DBMS exam and I’m weak at normalization" style="flex:1"><button class="btn s" data-a="chatsend" ${QS.busy?"disabled":""}>Send</button></div>`;
return `<p class="mut" style="margin:0 0 12px">Enter a topic and subject below.</p>`}
function qsetup(){return `<h1>Quiz Generator</h1><div class="card"><div class="row" style="margin-bottom:14px">${qtabs.map(t=>`<button class="btn s ${QS.mode===t[0]?"":"g"}" data-a="qmode" data-m="${t[0]}">${t[1]}</button>`).join("")}</div><div id="qsrc">${qsrc()}</div>${form("q",fld("qd","Difficulty",`<select id="qd">${opts(["Easy","Medium","Hard"])}</select>`)+fld("qn","Number of questions",`<select id="qn">${opts([5,10,15,20])}</select>`))}<br><button class="btn" id="qb" data-a="quiz">Generate Quiz</button></div><div id="qo" style="margin-top:16px"></div>`}
async function readPdf(file){if(!window.pdfjsLib)throw{};pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise;let t="";for(let i=1;i<=Math.min(doc.numPages,150);i++){const c=await(await doc.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(" ")+"\n\n";if(t.length>300000)break}return{text:t.replace(/[ \t]+/g," ").trim(),pages:doc.numPages}}
document.addEventListener("change",async e=>{if(e.target.id!=="qf")return;const f=e.target.files[0];if(!f)return;if(!/\.pdf$/i.test(f.name)&&f.type!=="application/pdf")return toast("Please choose a PDF file");if(f.size>25e6)return toast("That PDF is over 25 MB");$("#qst").textContent="Reading PDF…";try{const r=await readPdf(f);if(r.text.length<200){$("#qst").textContent="No readable text found. This looks like a scanned PDF.";return}QS.pdf={name:f.name,pages:r.pages,text:r.text};$("#qsrc").innerHTML=qsrc();toast("PDF ready")}catch(err){$("#qst").textContent="Couldn’t read that PDF. It may be encrypted, damaged, or blocked from loading."}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="qci"){e.preventDefault();A.chatsend()}});
V.quiz=()=>{if(!Q)return qsetup();
if(Q.done)return qres();const q=Q.qs[Q.i],sub=Q.sub!=null;return `<div class="row mut"><b>Question ${Q.i+1} of ${Q.qs.length}</b><div class="sp"></div>${esc(Q.f.topic)}</div><div class="bar" style="margin:8px 0 16px"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><div class="card"><h3>${esc(q.q)}</h3>${q.options.map((o,i)=>`<button class="opt ${sub?(i===q.answer?"ok":i===Q.sel?"no":""):i===Q.sel?"sel":""}" data-a="pick" data-i="${i}" ${sub?"disabled":""}>${"ABCD"[i]}. ${esc(o)}</button>`).join("")}${sub?`<div class="md"><p><b>${Q.sel===q.answer?"✓ Correct.":"✗ Incorrect."}</b> ${esc(q.explanation||"")}</p></div><button class="btn" data-a="next">${Q.i+1===Q.qs.length?"See results":"Next Question"}</button>`:`<button class="btn" data-a="submit" ${Q.sel==null?"disabled":""}>Submit answer</button>`}</div>`};
function qres(){const n=Q.qs.length,c=Q.ans.filter((a,i)=>a===Q.qs[i].answer).length,p=Math.round(c/n*100),t=Math.round((Q.end-Q.start)/1000),wrong=Q.qs.filter((q,i)=>Q.ans[i]!==q.answer);
return `<h1>Results</h1><div class="grid g4">${[["Total",n],["Correct",c],["Incorrect",n-c],["Score",p+"%"],["Time",Math.floor(t/60)+"m "+t%60+"s"]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div><br><div class="card"><h3>Performance analysis</h3><p>${p>=80?"Excellent grasp of this topic. Try a Hard quiz next.":p>=50?"Good base, with some gaps to close before the exam.":"This topic needs more revision. Review the explanation, then retake."}</p><h3>Revision recommendations</h3>${wrong.length?"<ul>"+wrong.map(q=>`<li>Revisit: ${esc(q.q)}</li>`).join("")+"</ul>":"<p>No weak areas found in this quiz.</p>"}<div class="row"><button class="btn" data-a="review">Review All Answers</button><button class="btn g" data-a="retake">Retake Quiz</button><button class="btn g" data-a="newq">Generate Another Quiz</button></div></div><div id="rv"></div>`}
async function genQuiz(){const f=val("q");f.focus=f.topic;
if(QS.mode==="pdf"){if(!QS.pdf)return toast("Upload a PDF first");const T=QS.pdf.text,k=f.focus?T.toLowerCase().indexOf(f.focus.toLowerCase()):-1,s=k>0?Math.max(0,k-1500):0;f.text=T.slice(s,s+28000);f.pdfName=QS.pdf.name;f.topic=f.focus||"PDF: "+QS.pdf.name}else if(!f.topic)return toast("Please enter a topic first");const b=$("#qb");b.disabled=true;$("#qo").innerHTML=skel();let qs,dm=false;
try{const r=await AI.quiz(f);qs=(r.questions||r).filter(q=>q&&q.q&&Array.isArray(q.options)&&q.options.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4);if(!qs.length)throw{}}catch(e){if(e&&e.code==="unavail"&&!f.text){qs=DEMO.quiz;dm=true;toast("Demo quiz: not AI generated")}else{$("#qo").innerHTML=`<div class="card">⚠️ ${AI.err(e)}</div>`;b.disabled=false;return}}
Q={f,qs,i:0,sel:null,sub:null,ans:[],start:Date.now(),demo:dm};route()}
/* Materials */
const types=["Short Summary Notes","Detailed University Notes","Important Exam Questions","Flashcards","Mind Map Outline","Quick Revision Cheat Sheet"];let M={md:"",f:null,type:"",edit:false};
V.materials=()=>`<h1>Study Material Generator</h1><div class="card">${form("m",lvl("m")+fld("mg","Language",`<select id="mg">${opts(["English","Hinglish"])}</select>`)+fld("mx","Material type",`<select id="mx">${opts(types)}</select>`))}<br><button class="btn" id="mb" data-a="material">Generate Material</button></div><div id="mo" style="margin-top:18px">${M.md?mout():""}</div>`;
const mout=()=>`<div class="row" style="margin-bottom:12px"><span class="tag">${esc(M.type)}</span><div class="sp"></div>${[["copy","Copy Text"],["dlm","Download"],["savem","Save Material"],["regen","Regenerate"],["editm",M.edit?"Done Editing":"Edit Content"]].map(x=>`<button class="btn g s" data-a="${x[0]}" data-w="m">${x[1]}</button>`).join("")}</div>${M.edit?`<textarea id="me" rows="18">${esc(M.md)}</textarea>`:`<div class="card md">${md(M.md)}</div>`}`;
async function material(re){const f=re?M.f:val("m");if(!f||!f.topic)return toast("Please enter a topic first");const type=re?M.type:$("#mx").value;M.f=f;M.type=type;M.edit=false;const b=$("#mb");b.disabled=true;$("#mo").innerHTML=skel();
try{M.md=await AI.material(f,type);if(!M.md.trim())throw{};if(!re){log("mat")}}catch(e){if(e&&e.code==="unavail"){M.md=DEMO.explain;$("#mo").innerHTML='<span class="tag warn">Demo content, not a live AI response</span><br><br>'+mout();b.disabled=false;return}$("#mo").innerHTML=`<div class="card">⚠️ ${AI.err(e)}</div>`;b.disabled=false;return}
$("#mo").innerHTML=mout();b.disabled=false}
V.library=()=>`<h1>My Materials</h1>${S.mat.length?`<div class="grid g3">${S.mat.map((m,i)=>`<div class="card"><span class="tag">${esc(m.type)}</span><h3 style="margin-top:10px">${esc(m.topic)}</h3><div class="mut">${esc(m.subject)} · ${fmt(m.ts)}</div><div class="row" style="margin-top:12px"><button class="btn s" data-a="openm" data-i="${i}">Open</button><button class="btn g s" data-a="delm" data-i="${i}">Delete</button></div></div>`).join("")}</div>`:`<div class="card" style="text-align:center;padding:44px"><div class="ic" style="margin:0 auto 12px">📚</div><b>Your library is empty</b><p class="mut">Generate study material and press Save Material.</p><a class="btn" href="#materials">Create material</a></div>`}`;
V.history=()=>{const it=[...S.ex.map(x=>({k:"💡 Explained",t:x.topic,ts:x.ts})),...S.qz.map(x=>({k:"📝 Quiz",t:`${x.topic}: ${x.score}/${x.total} (${x.pct}%) · ${x.diff}`,ts:x.ts})),...S.mat.map(x=>({k:"📚 Saved",t:x.topic+" · "+x.type,ts:x.ts}))].sort((a,b)=>b.ts-a.ts);return `<h1>My Learning History</h1><div class="card">${it.length?it.map(r=>`<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><span class="mut">${r.k} · ${new Date(r.ts).toLocaleString()}</span><br>${esc(r.t)}</div>`).join(""):'<div class="mut" style="text-align:center;padding:30px">No history yet. Your explanations, quizzes and saved materials will appear here.</div>'}</div>`};
V.settings=()=>`<h1>Profile and Settings</h1><div class="card grid" style="max-width:520px">${fld("sn","Display name",`<input id="sn" value="${esc(S.name)}">`)}<div class="row"><button class="btn" data-a="name">Save profile</button><button class="btn g" data-a="theme">Toggle dark mode</button></div><hr style="border:0;border-top:1px solid var(--bd);width:100%"><div class="mut">Your data is stored only in this browser. Accounts and cloud sync are not part of this version.</div><button class="btn g" style="color:var(--bad)" data-a="wipe">Delete all my data</button></div>`;
/* ---------- router ---------- */
const NAV=[["dashboard","🏠","Dashboard"],["explain","💡","Explain"],["quiz","📝","Quiz"],["materials","📚","Materials"],["library","🗂️","Library"],["history","🕘","History"],["settings","⚙️","Settings"]];
function route(){const r=(location.hash.slice(1)||"home"),v=V[r]?r:"home",pub=["home","about","contact"].includes(v);
$("#app").innerHTML=pub?`${V[v]()}<footer>© Study Buddy · Your Learning. Your Pace. Your Success.</footer>`:`<div class="shell"><nav class="side">${NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===v?"on":""}"><span>${n[1]}</span>${n[2]}</a>`).join("")}</nav><main>${V[v]()}</main></div><nav class="bn">${NAV.slice(0,5).map(n=>`<a href="#${n[0]}" class="${n[0]===v?"on":""}"><b>${n[1]}</b>${n[2]}</a>`).join("")}</nav>`;scrollTo(0,0)}
addEventListener("hashchange",route);
const keep=()=>{route()};
/* ---------- actions ---------- */
const A={theme,
 demo(){S.demo=!S.demo;save();route()},
 contact(){$("#cn").value.trim()&&$("#cm").value.trim()?toast("Thanks! (Demo form: nothing was sent)"):toast("Please fill in your name and message")},
 name(){S.name=$("#sn").value.trim()||"Student";save();toast("Profile saved")},
 wipe(){if(confirm("Delete all saved data?")){S={name:"Student",demo:false,ex:[],qz:[],mat:[],act:[]};save();E={md:"",f:null};M={md:"",f:null,type:"",edit:false};Q=null;route();toast("Data deleted")}},
 again(b){location.hash="explain";E.md="";setTimeout(()=>{$("#et").value=b.dataset.t;$("#es").value=b.dataset.s},0)},
 explain:b=>explain(b.dataset.m),
 async follow(){const q=$("#fq").value.trim();if(!q)return toast("Type a question first");$("#fo").innerHTML=skel();try{const a=await AI.ask(E.md,q);$("#fo").innerHTML=`<div class="md" style="margin-top:12px">${md(a)}</div>`}catch(e){$("#fo").innerHTML=`<p>⚠️ ${e&&e.code==="unavail"?"Follow-ups need live AI, which isn’t available here.":AI.err(e)}</p>`}},
 async copy(b){try{await navigator.clipboard.writeText(b.dataset.w==="e"?E.md:M.md);toast("Copied to clipboard")}catch(e){toast("Copy blocked by the browser")}},
 qmode(b){const ids=["qt","qs","qd","qn"],v=ids.map(i=>$("#"+i)?.value);QS.mode=b.dataset.m;route();ids.forEach((i,k)=>{if(v[k]!=null&&$("#"+i))$("#"+i).value=v[k]})},
 pdfclear(){QS.pdf=null;$("#qsrc").innerHTML=qsrc()},
 async chatsend(){const el=$("#qci");if(!el||QS.busy)return;const t=el.value.trim();if(!t)return;QS.chat.push({role:"user",content:t});QS.busy=true;const draw=()=>{$("#qsrc").innerHTML=qsrc();const c=$("#qc");if(c)c.scrollTop=c.scrollHeight};draw();try{const r=await AI.chat(QS.chat);QS.chat.push({role:"assistant",content:r});const m=r.match(/READY_TOPIC:\s*(.+?)\s*(?:\|\s*(.+))?$/m);if(m){QS.ready=m[1].trim();$("#qt").value=QS.ready;const sub=(m[2]||"").trim(),o=[...$("#qs").options].find(x=>x.value.toLowerCase()===sub.toLowerCase());if(o)$("#qs").value=o.value}}catch(e){QS.chat.pop();toast(e&&e.code==="unavail"?"Chat needs live AI, which isn’t available here.":AI.err(e))}QS.busy=false;draw()},
 quiz:genQuiz,material:()=>material(false),regen:()=>material(true),
 editm(){if(M.edit){M.md=$("#me").value}M.edit=!M.edit;$("#mo").innerHTML=mout()},
 savem(){if(M.edit)M.md=$("#me").value;S.mat.push({topic:M.f.topic,subject:M.f.subject,type:M.type,md:M.md,ts:Date.now()});save();toast("Saved to My Materials")},
 async dlm(){if(M.edit)M.md=$("#me").value;try{const d=await claude.use("downloads");if(!d)throw{};await d.save({filename:(M.f.topic||"material").replace(/[^\w-]+/g,"-")+".md",data:M.md});toast("Download started")}catch(e){toast("Download isn’t available here. Use Copy Text.")}},
 openm(b){const m=S.mat[+b.dataset.i];$("#dlg").innerHTML=`<h3>${esc(m.topic)}</h3><div class="md">${md(m.md)}</div><br><form method="dialog"><button class="btn">Close</button></form>`;$("#dlg").showModal()},
 delm(b){S.mat.splice(+b.dataset.i,1);save();route();toast("Deleted")},
 pick(b){Q.sel=+b.dataset.i;route()},
 submit(){Q.sub=Q.sel;Q.ans[Q.i]=Q.sel;route()},
 next(){if(Q.i+1===Q.qs.length){Q.done=true;Q.end=Date.now();const c=Q.ans.filter((a,i)=>a===Q.qs[i].answer).length;if(!Q.demo){S.qz.push({topic:Q.f.topic,subject:Q.f.subject,diff:Q.f.diff,score:c,total:Q.qs.length,pct:Math.round(c/Q.qs.length*100),ts:Date.now()});log("qz")}}else{Q.i++;Q.sel=null;Q.sub=null}route()},
 review(){$("#rv").innerHTML=Q.qs.map((q,i)=>`<div class="card" style="margin-top:12px"><b>${i+1}. ${esc(q.q)}</b><p>Your answer: ${Q.ans[i]!=null?esc(q.options[Q.ans[i]]):"-"} ${Q.ans[i]===q.answer?"✓":"✗"}<br>Correct: ${esc(q.options[q.answer])}</p><div class="mut">${esc(q.explanation||"")}</div></div>`).join("")},
 retake(){Q={...Q,i:0,sel:null,sub:null,ans:[],done:false,start:Date.now()};route()},
 newq(){Q=null;route()}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b)});
route();
</script></body></html>
